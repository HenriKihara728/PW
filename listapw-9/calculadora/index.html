
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculadora">

        <div class="display">
            <div class="expressao">17 + 12 + 20</div>
            <div class="resultado">20</div>
        </div>

        <button class="operacao">C</button>
        <button class="operacao">%</button>
        <button class="operacao">÷</button>
        <button class="operacao">×</button>

        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="operador">−</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="operador">+</button>

        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="igual">=</button>

        <button>0</button>
        <button>.</button>
        <button class="apagar">AP</button>

    </main>

</body>
</html>
