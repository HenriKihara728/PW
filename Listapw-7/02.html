<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festival de Personagens</title>
    <link rel="stylesheet" href="style02.css">
</head>

<body>

    <header>
        <h1>Festival de Personagens</h1>
        <p>Personagens de videogames</p>
    </header>

    <main>
        <div class="container">

            <div class="card">
                <div class="imagem">
                    <img src="imagens/mario.png" alt="Mario">
                </div>
                <h2>Mario</h2>
                <p>O encanador.</p>
            </div>

            <div class="card">
                <div class="imagem">
                    <img src="imagens/luigi.png" alt="Luigi">
                </div>
                <h2>Luigi</h2>
                <p>O irmão de Mario.</p>
            </div>

            <div class="card">
                <div class="imagem">
                    <img src="imagens/yoshi.png" alt="Yoshi">
                </div>
                <h2>Yoshi</h2>
                <p>O dinossauro.</p>
            </div>

            <div class="card">
                <div class="imagem">
                    <img src="imagens/Toad.png" alt="Toad">
                </div>
                <h2>Toad</h2>
                <p>O cogumelo.</p>
            </div>

        </div>
    </main>

</body>
</html>
