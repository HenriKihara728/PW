<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Imagens</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Galeria de Imagens</h1>
        <p>Home | Sobre | Contato</p>
    </header>

    <main>
        <section class="galeria">
            
            <div class="coluna">
                <div class="imagem">
                    <img src="imagens/nat.png" alt="Natureza">
                    <div class="legenda">Natureza</div>
                </div>

                <div class="imagem">
                    <img src="imagens/paisagem.png" alt="Paisagem">
                    <div class="legenda">Paisagem</div>
                </div>

                <div class="imagem">
                    <img src="imagens/montanha.png" alt="Montanha">
                    <div class="legenda">Montanha</div>
                </div>
            </div>

            <div class="coluna">
                <div class="imagem">
                    <img src="imagens/game.png" alt="Games">
                    <div class="legenda">Games</div>
                </div>

                <div class="imagem">
                    <img src="imagens/wii.png" alt="Videogame">
                    <div class="legenda">Videogame</div>
                </div>

                <div class="imagem">
                    <img src="imagens/jogo.png" alt="Jogo">
                    <div class="legenda">Jogos</div>
                </div>
            </div>

            <div class="coluna">
                <div class="imagem">
                    <img src="imagens/anime.png" alt="Anime">
                    <div class="legenda">Anime</div>
                </div>

                <div class="imagem">
                    <img src="imagens/personagens.png" alt="Personagem de anime">
                    <div class="legenda">Personagens</div>
                </div>

                <div class="imagem">
                    <img src="imagens/cena.png" alt="Cena de anime">
                    <div class="legenda">Cenas</div>
                </div>
            </div>

            <div class="limpar"></div>

        </section>

        <aside>
            <h2>Categorias</h2>
            <p>Natureza</p>
            <p>Games</p>
            <p>Animes</p>
            <p>Filmes</p>
        </aside>

        <div class="limpar"></div>

    </main>

    <footer>
        <p>Galeria de Imagens - 2026</p>
        <p>Instagram | Facebook | YouTube</p>
    </footer>

</body>
</html>
